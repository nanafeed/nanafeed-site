<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanafeed — Cookie Policy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #FFCC00;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .banana { font-size: 96px; line-height: 1; margin-bottom: 24px; }
    h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 20px;
      font-weight: 500;
      opacity: 0.7;
      margin-bottom: 48px;
    }
    .privacy-link {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }
    .privacy-link:hover { opacity: 1; }

    @media (max-width: 480px) {
      .banana { font-size: 72px; margin-bottom: 20px; }
      h1 { font-size: 40px; }
      .subtitle { font-size: 16px; margin-bottom: 32px; }
    }
  </style>
</head>
<body>
  <div class="banana" aria-hidden="true">🍌</div>
  <h1>Cookie Policy</h1>
  <p class="subtitle">Coming soon</p>
  <a class="privacy-link" href="/privacy">Privacy Policy</a>
</body>
</html>
