<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nanafeed</title>
<meta name="description" content="nanafeed — the social app about bananas. Rate the banana you actually ate, check ripeness with your camera, and see what the shelf near you really tastes like.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="nanafeed">
<meta property="og:title" content="nanafeed — the social app about bananas">
<meta property="og:description" content="Rate the banana you actually ate, check ripeness with your camera, and see what the shelf near you really tastes like.">
<meta property="og:image" content="https://nanafeed.io/linkedin_cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="nanafeed — the social app about bananas">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="nanafeed — the social app about bananas">
<meta name="twitter:description" content="Rate the banana you actually ate, check ripeness with your camera, and see what the shelf near you really tastes like.">
<meta name="twitter:image" content="https://nanafeed.io/linkedin_cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
  :root{--navy:#0F1A4D;--ink-2:#5B6488;--mute:#8E95B3;--yellow:#F5C800;--bg:#F9F9F9;
        --font:"Nunito",-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);font-size:17px;line-height:1.5;
       min-height:100svh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
  .box{text-align:center;max-width:460px}
  .mark{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-size:22px;
        color:var(--navy);letter-spacing:-.02em}
  .mark img{height:30px;width:auto;display:block}
  h1{font-size:22px;font-weight:800;margin:26px 0 6px}
  p{margin:0;color:var(--ink-2);font-weight:600;font-size:15px}
  .open{display:inline-block;margin-top:24px;padding:14px 28px;border-radius:999px;background:var(--yellow);
        color:var(--navy);font-weight:900;font-size:17px;text-decoration:none}
  .open:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
  /* same badge sizing as the landing page: Google bakes clear space into its file,
     so its canvas is scaled up and the extra is pulled back in with a negative margin */
  .cta{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:24px;--badge-h:54px}
  .appstore,.googleplay{display:inline-flex;align-items:center;text-decoration:none;border-radius:8px}
  .appstore img{display:block;height:var(--badge-h);width:auto}
  .googleplay img{display:block;height:calc(var(--badge-h)/.672);width:auto;margin:calc(var(--badge-h) * -.244)}
  .appstore:focus-visible,.googleplay:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
  .back{display:inline-block;margin-top:22px;font-size:13px;font-weight:700;color:var(--mute)}
  #post{display:none}
  @media (max-width:430px){.cta{--badge-h:48px}}
</style>
</head>
<body>
<div class="box">
  <a class="mark" href="/" aria-label="nanafeed"><img src="/img/logo-n.png" alt="">anafeed</a>

  <!-- /post/<id>: a shared banana. The button points at this very URL, so on a phone
       with the app installed the tap goes through the universal link / app link. -->
  <div id="post">
    <h1>This banana lives in nanafeed</h1>
    <p>Open the post in the app to see the photo, the taste score and where it was bought.</p>
    <a class="open" id="open-app" href="/">Open in nanafeed</a>
    <div class="cta">
      <a class="appstore" href="https://apps.apple.com/app/id6766258928" rel="noopener">
        <img src="/img/app-store-badge.svg" alt="Download on the App Store" width="162" height="54">
      </a>
      <a class="googleplay" href="https://play.google.com/store/apps/details?id=com.bananiv.nanafeed" rel="noopener">
        <img src="/img/google-play-badge.png" alt="Get it on Google Play" width="207" height="80">
      </a>
    </div>
  </div>

  <div id="plain">
    <h1>404 — this shelf is empty</h1>
    <p>There’s no page here. The bananas are back on the homepage.</p>
  </div>

  <a class="back" href="/">nanafeed.io</a>
</div>
<script>
(function(){
  if (!/^\/post\/./.test(location.pathname)) return;
  document.getElementById('plain').style.display = 'none';
  var post = document.getElementById('post');
  post.style.display = 'block';
  document.getElementById('open-app').href = location.href;
})();
</script>
</body>
</html>
